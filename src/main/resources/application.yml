spring:
  application:
    name: issue-triage-assistant
  datasource:
    url: jdbc:postgresql://localhost:5433/triage
    username: copilot
    password: copilot
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that the entities match it
    open-in-view: false   # no DB session while writing the HTTP response: lazy loading there fails loudly instead of hiding N+1 queries
  flyway:
    baseline-on-migrate: true   # the existing DB already has V1's tables: mark it as version 1 instead of running V1
    baseline-version: 1
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all   # "stored" only when the broker has written it (the default since Kafka 3, written out for clarity)
      properties:
        # Defaults would let a send hang for 60 s when Kafka is down; GitHub waits only 10 s for our answer.
        max.block.ms: 2000          # max wait for topic metadata before send() gives up
        request.timeout.ms: 4000    # max wait for one broker response
        delivery.timeout.ms: 5000   # max total time for a send, retries included (must be >= linger + request timeout)
    consumer:
      auto-offset-reset: earliest   # a new consumer group starts at the oldest message, so nothing sent before it started is missed

github:
  api-url: https://api.github.com
  token: ${GITHUB_TOKEN:}   # from the environment; empty if not set. Never put a real token here.
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}   # shared secret for webhook signatures; empty = refuse all webhooks
  app:
    # The GitHub App that posts comments in comment mode (M5). Both empty = shadow mode only.
    id: ${GITHUB_APP_ID:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}   # a .pem file outside the repo, never committed

triage:
  outbox:
    poll-ms: 500          # the relay looks for unsent outbox rows this often (after the previous run ended)
  candidates:
    # Per repo: issues with any of these labels are never returned as duplicate candidates (bookkeeping copies).
    # The [brackets] keep the "/" in the map key. Example:
    #   exclude-labels:
    #     "[spring-projects/spring-boot]":
    #       - "status: forward-port"
    # Nothing is configured: excluding spring-boot's forward-port clones LOWERED recall (45.6% vs 46.2% at top 3),
    # because maintainers sometimes name a clone as the original (M4 step 0, docs/learning-notes.md).
    exclude-labels: {}
  llm:
    # fake | anthropic | auto (= anthropic if ANTHROPIC_API_KEY is set, else the fake). Tests force "fake".
    provider: auto
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}   # from the environment only; never put a real key here
      model: claude-haiku-5-5          # sai's choice at STOP A ($0.10 / $0.50 per million input / output tokens)
      max-tokens: 1024
      thinking: disabled               # short classification/draft tasks; thinking tokens would be billed
    # Cost guard: above this many tokens (input + output) per UTC day, LLM calls are refused and reports say so.
    daily-token-budget: 200000
  duplicates:
    # Comment mode (M5) posts only if the top match scores >= this AND the LLM confirms "same root problem".
    # 0.90 = the strictest value tested in M5 step 1 (docs/m4-results.md section 4); was 0.825 (M3's 10% false alarms).
    # The LLM check in reports also runs only above it.
    comment-threshold: 0.90
    # Below this the demo page calls a match "low" similarity (between the two: "medium", above comment-threshold: "high").
    possible-threshold: 0.75
  docs:
    sources:
      # Reference docs for draft replies (M4 step 4): Antora pages at a fixed release tag.
      "[spring-projects/spring-boot]":
        tag: v4.1.2
        root: documentation/spring-boot-docs/src/docs/antora/modules
        modules: ROOT, reference, how-to
        site-url: https://docs.spring.io/spring-boot/4.1
        exclude-pages: ROOT/redirect   # a page of old anchors only: matches everything, says nothing
  draft:
    # A source goes into the draft prompt only above these cosine similarities. Without any, there is no draft.
    # 0.55: the top docs score of the median recent external issue is 0.59 (0.42 at p10, 0.71 at p90).
    min-doc-score: 0.55
    min-issue-score: 0.75
  fixed-hint:
    min-score: 0.75   # the "already fixed?" hint looks at the top match only if it is at least this similar
  comments:
    # Comment mode (off by default; per repo with SQL: INSERT INTO repo_setting VALUES ('owner/name', 'SUGGEST')).
    # Issues with these labels never get a comment: the team's per-branch clones, which the LLM rightly calls "the same
    # problem" (21 of 48 confirmed false alarms in M5 step 1).
    skip-labels:
      "[spring-projects/spring-boot]":
        - "status: forward-port"
        - "status: back-port"
  labels:
    threshold: 0.5            # suggest a label if similar issues holding it have >= 50% of the similarity weight
    ignore-prefixes: "status:"  # workflow labels (status: waiting-for-triage, status: duplicate...) are never suggested

management:
  endpoints:
    web:
      exposure:
        include: health,info
