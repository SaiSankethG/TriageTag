spring:
  application:
    name: incident-copilot
  datasource:
    url: jdbc:postgresql://localhost:5432/copilot
    username: copilot
    password: copilot
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info
