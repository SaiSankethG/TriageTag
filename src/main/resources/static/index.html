<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Triage Assistant</title>
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --text: #1c1c1a; --muted: #66665f; --line: #deded7; --soft: #efefea;
    --accent: #2f5fd0; --accent-text: #ffffff;
    --green: #1e7a3e; --green-bg: #e7f4ea; --amber: #8a5a00; --amber-bg: #fdf1dc; --red: #b3261e; --red-bg: #fbe9e7;
    --grey-bg: #ececea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1e1e1c; --text: #ecece8; --muted: #a3a39c; --line: #34342f; --soft: #262624;
      --accent: #7ea2ff; --accent-text: #10131a;
      --green: #6fd08f; --green-bg: #17301f; --amber: #f0b45a; --amber-bg: #33280f; --red: #ff8a80; --red-bg: #3a1a17;
      --grey-bg: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { font-size: 22px; margin: 0; }
  header p { color: var(--muted); margin: 2px 0 16px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  a { color: var(--accent); }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .issue-list { max-height: 30vh; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--card); color: var(--text); }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent);
           color: var(--accent-text); cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .issue-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 60vh; overflow-y: auto; }
  .issue-list li + li { border-top: 1px solid var(--line); }
  .issue-list button { display: block; width: 100%; text-align: left; background: none; color: var(--text);
                       padding: 8px 4px; border-radius: 4px; }
  .issue-list button:hover, .issue-list button[aria-current="true"] { background: var(--soft); }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line);
         margin: 2px 6px 2px 0; font-size: 12px; white-space: nowrap; }
  .tag.high { color: var(--red); border-color: var(--red); }
  .tag.medium { color: var(--amber); border-color: var(--amber); }
  .tag.low { color: var(--green); border-color: var(--green); }
  .tag.open { color: var(--green); border-color: var(--green); }
  .tag.closed { color: var(--muted); }
  .banner { border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid; }
  .banner strong { font-size: 17px; display: block; }
  .banner.green { background: var(--green-bg); border-color: var(--green); }
  .banner.amber { background: var(--amber-bg); border-color: var(--amber); }
  .banner.red { background: var(--red-bg); border-color: var(--red); }
  .banner.grey { background: var(--grey-bg); border-color: var(--line); }
  .note { background: var(--grey-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; color: var(--muted); }
  .error { background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .hint { background: var(--amber-bg); border-left: 4px solid var(--amber); border-radius: 6px; padding: 10px 12px; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.score { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li { padding: 3px 0; }
  .mark { display: inline-block; width: 1.4em; font-weight: 700; }
  .yes { color: var(--green); } .no { color: var(--red); } .na { color: var(--muted); }
  .draft { white-space: pre-wrap; word-break: break-word; background: var(--soft); border: 1px solid var(--line);
           border-radius: 8px; padding: 12px; margin: 0 0 8px; font: inherit; }
  .body { white-space: pre-wrap; word-break: break-word; background: var(--soft); border-radius: 8px; padding: 10px;
          margin: 8px 0 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
             vertical-align: -3px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  footer { color: var(--muted); font-size: 13px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Issue Triage Assistant</h1>
    <p>What the assistant would privately tell a maintainer about a new GitHub issue.</p>
  </header>

  <div class="layout">
    <!-- Left: pick an issue -->
    <section class="card" aria-labelledby="pick-heading">
      <h2 id="pick-heading">Pick an issue</h2>
      <form id="number-form">
        <div class="row">
          <div><label for="repo">Repository</label><input id="repo" value="spring-projects/spring-boot" autocomplete="off"></div>
        </div>
        <div class="row">
          <div><label for="number">Issue number</label><input id="number" type="number" min="1" inputmode="numeric"></div>
          <div style="flex:0 0 auto; align-self:end"><button id="show" type="submit">Show</button></div>
        </div>
      </form>
      <label for="search">Or search recent issues by title</label>
      <input id="search" type="search" placeholder="e.g. datasource, actuator" autocomplete="off">
      <div id="list-status" class="small muted" aria-live="polite"></div>
      <ul id="issue-list" class="issue-list" aria-label="Issues"></ul>
      <details class="small" style="margin-top:12px">
        <summary>Admin (create new reports)</summary>
        <label for="admin-token" style="margin-top:6px">Admin token (kept only in this browser tab)</label>
        <input id="admin-token" type="password" autocomplete="off">
      </details>
    </section>

    <!-- Right: the report -->
    <div>
      <div id="status" aria-live="polite"></div>
      <div id="report"></div>
    </div>
  </div>
</main>

<script>
  // Every piece of issue or LLM text is inserted with textContent (via el()), never as HTML.
  const $ = (id) => document.getElementById(id);
  let settings = null;          // from GET /settings: thresholds, model, budget
  let searchTimer = null;

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null) continue;
      if (key === 'class') node.className = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children) {
      if (child != null && child !== false) node.append(child instanceof Node ? child : String(child));
    }
    return node;
  }

  function link(url, text) {
    return /^https?:\/\//.test(url || '') ? el('a', { href: url, target: '_blank', rel: 'noopener' }, text) : text;
  }

  // Scores are shown with one decimal (0.825 -> "82.5%"); levels use the same rounded value, so "75%" is never "Low".
  const rounded = (score) => Math.round(score * 1000) / 1000;
  const pct = (score) => `${Math.round(score * 1000) / 10}%`;
  const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

  function level(score) {
    if (!settings) return null;
    if (rounded(score) >= settings.commentThreshold) return ['high', 'High'];
    if (rounded(score) >= settings.possibleThreshold) return ['medium', 'Medium'];
    return ['low', 'Low'];
  }

  function authorText(association) {
    return ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association)
      ? 'opened by the team' : 'opened by an outside reporter';
  }

  function setStatus(node) { $('status').replaceChildren(...(node ? [node] : [])); }
  function loading(text) { setStatus(el('div', { class: 'note' }, el('span', { class: 'spinner', 'aria-hidden': 'true' }), text)); }
  function errorBox(text) { setStatus(el('div', { class: 'error', role: 'alert' }, text)); }

  // The admin token lives only in sessionStorage (this tab, gone when it closes); never in the URL or long-term storage.
  function adminToken() { return $('admin-token').value.trim(); }
  function rememberToken() {
    try { sessionStorage.setItem('triage-admin-token', adminToken()); } catch { /* storage blocked: keep it in the field only */ }
  }

  function repoValue() { return $('repo').value.trim(); }
  function validRepo(repo) { return /^[\w.-]+\/[\w.-]+$/.test(repo); }

  // --- URL: ?repo=owner/name&number=123, so a report can be shared or bookmarked ---
  function updateUrl(repo, number) {
    const params = new URLSearchParams({ repo, number: String(number) });
    history.replaceState(null, '', `?${params}`);
  }

  // --- the issue list ---
  async function loadList() {
    const repo = repoValue();
    if (!validRepo(repo)) { $('list-status').textContent = 'Enter a repository like owner/name.'; return; }
    const q = $('search').value.trim();
    $('list-status').textContent = 'Loading...';
    try {
      const params = new URLSearchParams({ size: '25' });
      if (q) params.set('q', q);
      const response = await fetch(`/repos/${repo}/issues?${params}`);
      if (!response.ok) throw new Error(`server answered ${response.status}`);
      const page = await response.json();
      $('issue-list').replaceChildren(...page.issues.map(issue => el('li', {},
        el('button', { type: 'button', 'data-number': issue.number, onclick: () => showReport(repo, issue.number) },
          el('span', { class: 'num' }, `#${issue.number} `), issue.title,
          el('div', { class: 'small muted' }, `${issue.state} · ${fmtDate(issue.createdAt)}`)))));
      $('list-status').textContent = page.total === 0
        ? (q ? `No titles contain "${q}".` : 'No stored issues for this repository.')
        : `${q ? 'Matching' : 'Newest'} ${page.issues.length} of ${page.total.toLocaleString()}`;
    } catch (e) {
      $('list-status').textContent = 'Could not load the issue list: ' + e.message;
    }
  }

  function markCurrent(number) {
    for (const b of document.querySelectorAll('#issue-list button')) {
      b.setAttribute('aria-current', String(b.dataset.number === String(number)));
    }
  }

  // --- the report ---
  async function showReport(repo, number, create = false) {
    if (!validRepo(repo) || !/^\d+$/.test(String(number))) { errorBox('Enter a repository like owner/name and an issue number.'); return; }
    $('number').value = number;
    updateUrl(repo, number);
    markCurrent(number);
    $('report').replaceChildren();
    loading(create ? 'Creating the report (runs the AI checks, a few seconds)...' : 'Loading the report...');
    try {
      // Creating a report spends LLM tokens, so the server only allows it with the admin token (header, never in the URL).
      const headers = create && adminToken() ? { 'X-Admin-Token': adminToken() } : {};
      const response = await fetch(`/reports/${repo}/${number}`, { method: create ? 'POST' : 'GET', headers });
      if (response.status === 404) {
        if (create) {
          setStatus(el('div', { class: 'note' }, `Issue #${number} isn't stored for ${repo}. Only issues the assistant has seen (backfill or webhook) can be triaged.`));
        } else if (!adminToken()) {
          setStatus(el('div', { class: 'note' }, `There's no report for #${number} yet. Only existing reports can be viewed on the public demo.`));
        } else {
          setStatus(el('div', { class: 'note' }, `There's no report for #${number} yet. `,
            el('button', { type: 'button', class: 'secondary', onclick: () => showReport(repo, number, true) }, 'Create report')));
        }
        return;
      }
      if (create && (response.status === 401 || response.status === 503)) {
        setStatus(el('div', { class: 'note' }, response.status === 401
          ? 'That admin token was not accepted. Only existing reports can be viewed on the public demo.'
          : 'Creating reports is switched off on this server (no admin token configured).'));
        return;
      }
      if (!response.ok) throw new Error(`the server answered ${response.status}`);
      const report = await response.json();
      setStatus(null);
      render(report);
      $('report').querySelector('.banner')?.focus();   // the answer first, for keyboard and screen-reader users
    } catch (e) {
      errorBox('Something went wrong: ' + e.message + '. Is the app running?');
    }
  }

  /** The one-line answer at the top: is this a duplicate? Colour AND words, never colour alone. */
  function verdict(r) {
    const top = (r.duplicates || [])[0];
    if (!top) return ['grey', 'No earlier issues to compare with', 'This is one of the first issues stored for this repository.'];
    const check = r.duplicateCheck;
    const best = `best match #${top.number} at ${pct(top.score)}`;
    if (settings && rounded(top.score) >= settings.commentThreshold) {
      if (check && check.verdict === 'YES') return ['red', `Likely duplicate of #${top.number} (Claude agrees)`, `Similarity ${pct(top.score)}, and the AI check says it is the same root problem.`];
      const said = check ? { NO: 'says it is a different problem', UNSURE: 'is not sure', UNKNOWN: 'could not decide' }[check.verdict] : 'was not run';
      return ['amber', `Possible duplicate of #${top.number}`, `Similarity ${pct(top.score)} is high, but the AI check ${said}.`];
    }
    if (settings && rounded(top.score) >= settings.possibleThreshold) {
      return ['amber', `Possible duplicate of #${top.number}`, `Medium similarity (${pct(top.score)}); a maintainer should take a look.`];
    }
    const needs = settings ? `, needs ${pct(settings.commentThreshold)}` : '';
    return ['green', 'Probably not a duplicate', `${best[0].toUpperCase()}${best.slice(1)}${needs}.`];
  }

  /** A calm grey note when the AI checks didn't run (no key, or today's budget used up). */
  function aiNote(r) {
    const notes = [r.notes, r.missing?.note, r.duplicateCheck?.reason, r.draftReply?.text].filter(Boolean).join(' ');
    if (/daily token budget/.test(notes)) {
      const resets = settings ? new Date(settings.budgetResetsAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' }) : 'midnight UTC';
      return `AI checks paused for this report (daily limit reached, resets ${resets}). Duplicates, labels and the "already fixed?" hint don't need AI and are complete.`;
    }
    if (r.llmModel === 'fake') {
      return 'AI checks are using a stand-in (no API key set), so the missing-details and draft parts below are placeholders, not real AI output.';
    }
    return null;
  }

  function render(r) {
    const parts = [];
    const [colour, title, detail] = verdict(r);
    parts.push(el('div', { class: `banner ${colour}`, role: 'status', tabindex: '-1' }, el('strong', {}, title), el('span', {}, detail)));
    const note = aiNote(r);
    if (note) parts.push(el('div', { class: 'note' }, note));

    // Issue card
    const card = r.issue;
    const bodyShort = card.bodyStart.length > 300 ? card.bodyStart.slice(0, 300) + '…' : card.bodyStart;
    const body = el('pre', { class: 'body' }, bodyShort || '(no description)');
    const more = card.bodyStart.length > 300 || card.bodyLength > card.bodyStart.length;
    let expanded = false;
    const toggle = more ? el('button', { type: 'button', class: 'link small', 'aria-expanded': 'false', onclick: () => {
      expanded = !expanded;
      body.textContent = expanded ? card.bodyStart + (card.bodyLength > card.bodyStart.length ? '\n…' : '') : bodyShort;
      toggle.textContent = expanded ? 'Show less' : 'Show more';
      toggle.setAttribute('aria-expanded', String(expanded));
    } }, 'Show more') : null;
    parts.push(el('section', { class: 'card', 'aria-labelledby': 'issue-heading' },
      el('h2', { id: 'issue-heading', tabindex: '-1' }, link(r.url, `#${r.number} ${r.title}`)),
      el('div', {}, el('span', { class: `tag ${card.state}` }, card.state === 'closed' && card.stateReason ? `closed (${card.stateReason.replace('_', ' ')})` : card.state),
        el('span', { class: 'small muted' }, ` ${authorText(card.authorAssociation)} · ${fmtDate(card.createdAt)}`)),
      card.labels.length ? el('div', {}, ...card.labels.map(l => el('span', { class: 'tag' }, l))) : null,
      body, toggle,
      card.bodyLength > card.bodyStart.length ? el('div', { class: 'small muted' }, 'Long description: the full text is on ', link(r.url, 'GitHub'), '.') : null));

    // Duplicates
    const dupRows = (r.duplicates || []).map(d => {
      const lv = level(d.score);
      return el('tr', {},
        el('td', {}, link(d.url, `#${d.number} ${d.title}`), ' ',
          d.state ? el('span', { class: `tag ${d.state}` }, d.state === 'closed' && d.stateReason ? `closed (${d.stateReason.replace('_', ' ')})` : d.state) : null),
        el('td', { class: 'score' }, pct(d.score), ' ', lv ? el('span', { class: `tag ${lv[0]}` }, lv[1]) : null));
    });
    const dupSection = [el('h2', {}, 'Similar earlier issues')];
    if (r.fixedHint) {
      dupSection.push(el('div', { class: 'hint' }, el('strong', {}, 'Already fixed? '), r.fixedHint.text, ' ',
        r.fixedHint.closerUrl ? link(r.fixedHint.closerUrl, '(what fixed it)') : null));
    }
    dupSection.push(dupRows.length ? el('table', {}, el('caption', { class: 'visually-hidden' }, 'Similar issues with similarity'), el('tbody', {}, ...dupRows))
      : el('p', { class: 'muted' }, 'None.'));
    if (r.duplicateCheck) {
      dupSection.push(el('p', { class: 'small' }, el('strong', {}, 'AI check of the best match: '),
        `${r.duplicateCheck.verdict.toLowerCase()}. ${r.duplicateCheck.reason}`));
    }
    if (settings) {
      dupSection.push(el('p', { class: 'small muted' }, `Similarity compares the meaning of the two issues' text (100% = the same). `
        + `High ≥ ${pct(settings.commentThreshold)}: the level at which the assistant would consider a public comment, and only if the AI check agrees. `
        + `Medium ≥ ${pct(settings.possibleThreshold)}: worth a look. Low: probably a different problem.`));
    }
    parts.push(el('section', { class: 'card' }, ...dupSection));

    // Labels + missing details
    const labels = r.labels || [];
    const m = r.missing || {};
    const names = { VERSION: 'Version', STEPS_TO_REPRODUCE: 'Steps to reproduce', EXPECTED_VS_ACTUAL: 'Expected vs actual behaviour', LOGS_OR_STACK_TRACE: 'Logs or stack trace' };
    let checklist;
    if (m.status !== 'OK') {
      checklist = el('p', { class: 'muted' }, 'Not checked: ' + (m.note || 'no answer from the AI check') + '.');
    } else {
      checklist = el('ul', { class: 'checklist' }, ...Object.keys(names).map(key => {
        const answer = m.details[key];
        const [mark, cls, word] = answer === 'PRESENT' ? ['✓', 'yes', 'given'] : answer === 'MISSING' ? ['✗', 'no', 'missing'] : ['–', 'na', 'not needed'];
        return el('li', {}, el('span', { class: `mark ${cls}`, 'aria-hidden': 'true' }, mark), `${names[key]} `, el('span', { class: 'small muted' }, `(${word})`));
      }));
    }
    parts.push(el('section', { class: 'card' },
      el('h2', {}, 'Suggested labels'),
      labels.length ? el('div', {}, ...labels.map(l => el('span', { class: 'tag' }, `${l.label} · ${pct(l.share)} of similar issues`)))
        : el('p', { class: 'muted' }, 'No label is clear enough to suggest.'),
      el('h3', {}, 'Details the reporter gave'), checklist));

    // Draft reply
    const draft = r.draftReply || {};
    const draftSection = [el('h2', {}, 'Draft reply (for the maintainer to edit)')];
    if (draft.status === 'OK') {
      const copy = el('button', { type: 'button', class: 'secondary', onclick: async () => {
        try { await navigator.clipboard.writeText(draft.text); copy.textContent = 'Copied'; }
        catch { copy.textContent = 'Copy failed: select the text instead'; }
        setTimeout(() => { copy.textContent = 'Copy reply'; }, 2000);
      } }, 'Copy reply');
      draftSection.push(el('pre', { class: 'draft' }, draft.text), copy);
      if ((draft.unknownLinks || []).length) {
        draftSection.push(el('p', { class: 'small no' }, 'Check these links: they are not among the sources: ' + draft.unknownLinks.join(', ')));
      }
    } else {
      draftSection.push(el('p', { class: 'muted' }, draft.text || 'No draft.'));
    }
    if ((draft.sources || []).length) {
      draftSection.push(el('h3', {}, 'Sources the draft could use'),
        el('ul', {}, ...draft.sources.map(s => el('li', {}, `${s.kind === 'docs' ? 'Docs' : 'Issue'}: `, link(s.url, s.title), el('span', { class: 'small muted' }, ` (${pct(s.score)})`)))));
    }
    parts.push(el('section', { class: 'card' }, ...draftSection));

    parts.push(el('footer', {}, `Report made ${new Date(r.createdAt).toLocaleString()} · model ${r.llmModel} · ${r.costTokens.toLocaleString()} tokens · prompts ${r.promptVersions}`));
    $('report').replaceChildren(...parts);
  }

  // --- wiring ---
  $('number-form').addEventListener('submit', (e) => { e.preventDefault(); showReport(repoValue(), $('number').value.trim()); });
  $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadList, 300); });
  $('repo').addEventListener('change', loadList);
  $('admin-token').addEventListener('input', rememberToken);

  (async function start() {
    try { $('admin-token').value = sessionStorage.getItem('triage-admin-token') || ''; } catch { /* storage blocked */ }
    try { settings = await (await fetch('/settings')).json(); } catch { settings = null; }
    const params = new URLSearchParams(location.search);
    if (params.get('repo')) $('repo').value = params.get('repo');
    await loadList();
    if (params.get('number')) showReport(repoValue(), params.get('number'));
  })();
</script>
</body>
</html>
