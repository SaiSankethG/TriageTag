<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Triage Assistant</title>
<style>
  /* Design: the verdict is a triage tag (red / amber / green band, punched hole, a stamp for what maintainers decided later).
     Everything around it stays quiet: cool clinical grey, white paper, ink text, one condensed face for headings. */
  :root {
    --bg: #eef1f0; --paper: #ffffff; --paper-2: #f6f8f7; --ink: #1c2126; --muted: #5c666e; --faint: #87919a;
    --line: #d5dbda; --link: #245c8a; --focus: #245c8a;
    --red: #c2362b; --amber: #c98a00; --green: #2e7a4e; --grey: #6b747c; --on-band: #ffffff; --on-amber: #1c2126;
    --red-tint: #f8e6e4; --amber-tint: #faf0d8; --green-tint: #e3f1e8;
    --condensed: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171b1e; --paper: #20262a; --paper-2: #262d32; --ink: #e4e8ea; --muted: #9aa4ab; --faint: #76808a;
      --line: #323a3f; --link: #8cb8e0; --focus: #8cb8e0;
      --red: #e0574b; --amber: #e3a72b; --green: #4fa673; --grey: #8a939b; --on-band: #ffffff; --on-amber: #1c2126;
      --red-tint: #3a2220; --amber-tint: #362c15; --green-tint: #1b3024;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; width: 100%; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1, h2, .condensed { font-family: var(--condensed); font-stretch: condensed; }
  h1 { font-size: 30px; line-height: 1.15; font-weight: 600; margin: 0; letter-spacing: -.005em; max-width: 30ch; }
  h2 { font-size: 20px; line-height: 1.25; font-weight: 600; margin: 0 0 12px; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }

  /* Header */
  .bar { border-bottom: 1px solid var(--line); background: var(--paper); }
  .bar-inner { max-width: 1260px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .name { font-family: var(--condensed); font-stretch: condensed; font-size: 21px; font-weight: 600; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .name .swatches { display: inline-flex; gap: 3px; }
  .name .swatches i { width: 6px; height: 18px; border-radius: 2px; display: block; }
  .bar nav { margin-left: auto; display: flex; gap: 18px; }
  .bar nav a { color: var(--muted); text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  .bar nav a[aria-current="page"], .bar nav a:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* Layout */
  .layout { max-width: 1260px; margin: 0 auto; padding: 22px 16px 56px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; gap: 20px; } .list { max-height: 34vh; } }
  @media (min-width: 821px) { .picker { position: sticky; top: 16px; } }   /* sticky only beside the report, never on phones */

  /* Picker (the inbox on the left) */
  .picker { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .open-row { display: flex; gap: 8px; }
  .btn { border: 0; background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 6px; font-weight: 600; }
  .btn.quiet { background: transparent; color: var(--link); border: 1px solid var(--line); }
  .switch { display: flex; gap: 16px; margin: 16px 0 8px; border-bottom: 1px solid var(--line); }
  .switch button { border: 0; background: none; color: var(--muted); padding: 6px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; }
  .switch button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .list { list-style: none; margin: 6px -8px 0; padding: 0; max-height: 62vh; overflow-y: auto; overflow-x: hidden; }
  .list button { display: grid; grid-template-columns: 6px 1fr; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 9px 8px; border-radius: 6px; }
  .list button:hover, .list button[aria-current="true"] { background: var(--paper-2); }
  .list .stripe { border-radius: 3px; background: var(--line); }
  .list .stripe.high { background: var(--red); } .list .stripe.medium { background: var(--amber); } .list .stripe.low { background: var(--green); }
  .list .t, .example, .row a, .tag .match, .issue-head h1 { overflow-wrap: anywhere; }
  .list .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .list .m { font-size: 12px; color: var(--faint); }
  .repo-select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
  .admin { margin-top: 14px; font-size: 13px; }
  .admin summary { color: var(--muted); cursor: pointer; }
  .admin label { display: block; color: var(--muted); margin: 10px 0 4px; }

  /* Report */
  .report { display: grid; gap: 22px; }
  .issue-head .who { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .issue-head h1 a { color: var(--ink); text-decoration: none; }
  .issue-head h1 a:hover { text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--paper); }
  .chip.open { border-color: var(--green); color: var(--green); }
  details.fold { margin-top: 10px; }
  details.fold summary { cursor: pointer; color: var(--link); font-size: 14px; }
  .issue-text { white-space: pre-wrap; word-break: break-word; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0 0; font: 14px/1.6 system-ui, sans-serif; max-width: 80ch; }

  .split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 1060px) { .split { grid-template-columns: 1fr; } }

  /* The triage tag */
  .tag { position: relative; background: var(--paper); border-radius: 6px 6px 12px 12px; padding-top: 30px;
         clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%, 0 26px); outline: none; }
  .tag::before { content: ""; position: absolute; top: 9px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
                 background: var(--bg); box-shadow: inset 0 0 0 2px var(--line); }
  .tag .band { padding: 12px 20px 14px; color: var(--on-band); }
  .tag.red .band { background: var(--red); } .tag.amber .band { background: var(--amber); color: var(--on-amber); }
  .tag.green .band { background: var(--green); } .tag.grey .band { background: var(--grey); }
  .tag .band .verdict { font-family: var(--condensed); font-stretch: condensed; font-size: 28px; font-weight: 700; line-height: 1.1; }
  .tag .band .why { font-size: 14px; opacity: .95; margin-top: 2px; }
  .tag .body { padding: 16px 20px 20px; }
  .tag .score { font-family: var(--condensed); font-stretch: condensed; font-size: 44px; font-weight: 600; line-height: 1; }
  .tag .score small { font-size: 15px; font-family: system-ui, sans-serif; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .scale { position: relative; height: 8px; border-radius: 4px; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--line); margin: 14px 0 26px; }
  .scale .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
  .scale .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--muted); }
  .scale .tick span { position: absolute; top: 16px; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
  .fill.high { background: var(--red); } .fill.medium { background: var(--amber); } .fill.low { background: var(--green); }
  .tag .match { font-size: 14px; }
  .tag .ai { font-size: 14px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .stamp { margin: 16px 20px 22px; padding: 10px 12px; border: 2px dashed var(--muted); border-radius: 6px; transform: rotate(-1.2deg);
           font-size: 14px; color: var(--ink); background: var(--paper-2); }
  .stamp b { font-family: var(--condensed); font-stretch: condensed; font-size: 16px; display: block; }
  .stamp .hit { color: var(--green); font-weight: 600; } .stamp .miss { color: var(--red); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) {
    .tag.arrive { animation: arrive .45s cubic-bezier(.2, .8, .2, 1); transform-origin: 50% 0; }
    @keyframes arrive { from { transform: rotate(-4deg) translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  }

  /* Evidence (right of the tag) */
  .evidence { display: grid; gap: 22px; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .row { padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; padding-top: 2px; }
  .row .top { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  .row .pct { font-family: var(--condensed); font-stretch: condensed; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .state { font-size: 13px; color: var(--muted); }
  .row .meter { height: 4px; border-radius: 2px; background: var(--paper-2); margin-top: 8px; overflow: hidden; }
  .row .meter > div { height: 100%; }
  .fixed { background: var(--amber-tint); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding: 5px 0; }
  .checks .mark { font-weight: 800; text-align: center; }
  .checks .given { color: var(--green); } .checks .missing { color: var(--red); } .checks .na { color: var(--faint); }
  .checks .hint-text { display: block; font-size: 12px; color: var(--faint); }
  .labels { display: flex; flex-wrap: wrap; gap: 6px; }
  .label { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line); }

  /* Draft reply */
  .draft-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .draft { white-space: pre-wrap; word-break: break-word; margin: 12px 0 0; padding: 14px 16px; border-left: 3px solid var(--ink);
           background: var(--paper-2); border-radius: 0 8px 8px 0; font: 15px/1.65 system-ui, sans-serif; max-width: 78ch; }

  /* Welcome */
  .welcome { padding: 8px 0; max-width: 760px; }
  .welcome h1 { font-size: 40px; max-width: 18ch; }
  .welcome .lede { font-size: 17px; color: var(--muted); max-width: 60ch; margin: 12px 0 26px; }
  .legend { display: grid; gap: 10px; margin: 0 0 28px; max-width: 560px; }
  .legend div { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; }
  .legend i { width: 10px; height: 100%; min-height: 22px; border-radius: 3px; display: block; }
  .examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .examples { grid-template-columns: 1fr; } .welcome h1 { font-size: 32px; } }
  .example { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink); display: grid; grid-template-columns: 6px 1fr; gap: 12px; }
  .example:hover { border-color: var(--ink); }
  .example .stripe { border-radius: 3px; }
  .stripe.high { background: var(--red); } .stripe.medium { background: var(--amber); } .stripe.low { background: var(--green); }

  .note { background: var(--paper); border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 12px 14px; }
  .error { background: var(--red-tint); color: var(--red); border-radius: 8px; padding: 12px 14px; }
  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  footer.meta { font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="name" href="/" aria-label="Issue Triage Assistant, home">
      <span class="swatches" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--amber)"></i><i style="background:var(--green)"></i></span>
      Issue Triage Assistant
    </a>
    <span class="small muted" id="repo-chip"></span>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/app.html" aria-current="page">Reports</a>
      <a href="/guide.html">How to use</a>
    </nav>
  </div>
</header>

<div class="layout">
  <aside class="picker" aria-labelledby="pick-heading">
    <h2 id="pick-heading" class="visually-hidden">Choose an issue</h2>
    <label for="repo" class="small muted" style="display:block;margin-bottom:4px">Repository</label>
    <select id="repo" class="repo-select"><option value="spring-projects/spring-boot">spring-projects/spring-boot</option></select>
    <form id="number-form" class="open-row" style="margin-top:12px">
      <label for="number" class="visually-hidden">Issue number</label>
      <!-- Text, not type=number: no up/down arrows; only digits are accepted when opening. -->
      <input id="number" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Issue number">
      <button id="show" class="btn" type="submit">Open</button>
    </form>
    <div class="switch" role="tablist" aria-label="Which issues">
      <button id="tab-reports" role="tab" aria-selected="true" type="button">Triaged</button>
      <button id="tab-all" role="tab" aria-selected="false" type="button">All issues</button>
    </div>
    <div id="search-box" hidden>
      <label for="search" class="visually-hidden">Search titles</label>
      <input id="search" type="search" placeholder="Search titles, e.g. datasource" autocomplete="off">
    </div>
    <div id="list-status" class="small faint" aria-live="polite" style="margin-top:8px"></div>
    <ul id="issue-list" class="list" aria-label="Issues"></ul>
    <details class="admin">
      <summary>Admin</summary>
      <label for="admin-token">Admin token, to triage issues that have no report yet (kept only in this tab)</label>
      <input id="admin-token" type="password" autocomplete="off">
    </details>
  </aside>

  <main>
    <div id="status" aria-live="polite"></div>
    <div id="report" class="report"></div>
  </main>
</div>

<script>
  // Every piece of issue or LLM text is inserted with textContent (via el()), never as HTML.
  const $ = (id) => document.getElementById(id);
  let settings = null;          // from GET /settings: thresholds, model, budget
  let searchTimer = null;
  let tab = 'reports';          // which list the picker shows

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null) continue;
      if (key === 'class') node.className = value;
      else if (key === 'style') node.style.cssText = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children) {
      if (child != null && child !== false) node.append(child instanceof Node ? child : String(child));
    }
    return node;
  }

  function link(url, text) {
    return /^https?:\/\//.test(url || '') ? el('a', { href: url, target: '_blank', rel: 'noopener' }, text) : text;
  }

  // Scores are shown with one decimal (0.825 -> "82.5%"); levels use the same rounded value, so "75%" is never "low".
  const rounded = (score) => Math.round(score * 1000) / 1000;
  const pct = (score) => `${Math.round(score * 1000) / 10}%`;
  const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

  function level(score) {
    if (!settings) return 'low';
    if (rounded(score) >= settings.commentThreshold) return 'high';
    if (rounded(score) >= settings.possibleThreshold) return 'medium';
    return 'low';
  }
  const levelWord = { high: 'very similar', medium: 'similar', low: 'not very similar' };

  const isTeam = (association) => ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association);
  function stateText(state, reason) {
    if (state !== 'closed') return 'open';
    return { completed: 'closed as fixed', not_planned: 'closed as not planned', duplicate: 'closed as a duplicate' }[reason] || 'closed';
  }

  function setStatus(node) { $('status').replaceChildren(...(node ? [node] : [])); }
  function loading(text) { setStatus(el('div', { class: 'note' }, el('span', { class: 'spinner', 'aria-hidden': 'true' }), text)); }
  function errorBox(text) { setStatus(el('div', { class: 'error', role: 'alert' }, text)); }

  // The admin token lives only in sessionStorage (this tab, gone when it closes); never in the URL or long-term storage.
  function adminToken() { return $('admin-token').value.trim(); }
  function rememberToken() {
    try { sessionStorage.setItem('triage-admin-token', adminToken()); } catch { /* storage blocked: keep it in the field only */ }
  }

  function repoValue() { return $('repo').value.trim(); }
  function validRepo(repo) { return /^[\w.-]+\/[\w.-]+$/.test(repo); }

  // --- URL: ?repo=owner/name&number=123, so a report can be shared or bookmarked ---
  function updateUrl(repo, number) {
    const params = new URLSearchParams({ repo, number: String(number) });
    history.replaceState(null, '', `?${params}`);
  }

  // --- repositories: the switcher lists every repository the assistant has issues for ---
  async function loadRepos(preferred) {
    let repos = [];
    try { repos = await (await fetch('/repos')).json(); } catch { repos = []; }
    const names = repos.map(r => r.repo);
    const chosen = preferred && validRepo(preferred) ? preferred : (names[0] || 'spring-projects/spring-boot');
    if (!names.includes(chosen)) names.unshift(chosen);
    $('repo').replaceChildren(...names.map(name => {
      const r = repos.find(x => x.repo === name);
      return el('option', { value: name }, r ? `${name} (${r.triaged.toLocaleString()} triaged)` : name);
    }));
    $('repo').value = chosen;
  }

  // --- the picker list ---
  function setTab(which) {
    tab = which;
    $('tab-reports').setAttribute('aria-selected', String(which === 'reports'));
    $('tab-all').setAttribute('aria-selected', String(which === 'all'));
    $('search-box').hidden = which !== 'all';
    loadList();
  }

  function listItem(number, title, stripeLevel, meta, onClick) {
    return el('li', {}, el('button', { type: 'button', 'data-number': number, onclick: onClick },
      el('span', { class: `stripe ${stripeLevel || ''}`, 'aria-hidden': 'true' }),
      el('span', {}, el('span', { class: 't' }, el('span', { class: 'faint' }, `#${number} `), title), el('span', { class: 'm' }, meta))));
  }

  async function loadList() {
    const repo = repoValue();
    $('repo-chip').textContent = validRepo(repo) ? repo : '';
    if (!validRepo(repo)) { $('list-status').textContent = 'Set a repository like owner/name under Admin.'; return []; }
    $('list-status').textContent = 'Loading…';
    try {
      if (tab === 'reports') {
        const response = await fetch(`/reports/${repo}?limit=50`);
        if (!response.ok) throw new Error(`server answered ${response.status}`);
        const items = await response.json();
        $('issue-list').replaceChildren(...items.map(r => listItem(r.number, r.title, r.topScore != null ? level(r.topScore) : null,
          r.topScore != null ? `best match ${pct(r.topScore)}, ${r.state}` : r.state, () => showReport(repo, r.number))));
        $('list-status').textContent = items.length ? 'Newest triaged issues. The stripe shows how close the best match is.' : 'No issue has been triaged yet.';
        return items;
      }
      const q = $('search').value.trim();
      const params = new URLSearchParams({ size: '50' });
      if (q) params.set('q', q);
      const response = await fetch(`/repos/${repo}/issues?${params}`);
      if (!response.ok) throw new Error(`server answered ${response.status}`);
      const page = await response.json();
      $('issue-list').replaceChildren(...page.issues.map(issue => listItem(issue.number, issue.title, null,
        `${issue.state}, ${fmtDate(issue.createdAt)}${isTeam(issue.authorAssociation) ? ', by the team' : ''}${issue.hasReport ? ', triaged' : ''}`,
        () => showReport(repo, issue.number))));
      $('list-status').textContent = page.total === 0
        ? (q ? `No titles contain "${q}".` : 'No stored issues for this repository.')
        : `${q ? 'Matching' : 'Newest'} ${page.issues.length} of ${page.total.toLocaleString()}`;
    } catch (e) {
      $('list-status').textContent = 'The list did not load (' + e.message + '). Is the app running?';
    }
    return [];
  }

  function markCurrent(number) {
    for (const b of document.querySelectorAll('#issue-list button')) {
      b.setAttribute('aria-current', String(b.dataset.number === String(number)));
    }
  }

  // --- the welcome view (nothing opened yet) ---
  function renderWelcome(reports) {
    const repo = repoValue();
    const examples = reports.filter(r => r.topScore != null && rounded(r.topScore) >= (settings ? settings.possibleThreshold : 0.75)).slice(0, 4);
    const t = settings ? [pct(settings.commentThreshold), pct(settings.possibleThreshold)] : ['90%', '75%'];
    $('report').replaceChildren(el('section', { class: 'welcome' },
      el('h1', {}, 'Triage new issues before you open them'),
      el('p', { class: 'lede' }, 'For each new GitHub issue, the assistant finds earlier issues about the same problem, checks what the reporter left out, '
        + 'and drafts a first reply from your own docs. It writes a private note for maintainers. It never comments on GitHub unless you switch that on.'),
      el('div', { class: 'legend' },
        el('div', {}, el('i', { style: 'background:var(--red)' }), el('span', {}, el('strong', {}, 'Likely duplicate. '), `Very similar to an earlier issue (${t[0]} or more), and an AI check agrees it is the same problem.`)),
        el('div', {}, el('i', { style: 'background:var(--amber)' }), el('span', {}, el('strong', {}, 'Possible duplicate. '), `Similar to an earlier issue (${t[1]} or more). Worth a look before you answer.`)),
        el('div', {}, el('i', { style: 'background:var(--green)' }), el('span', {}, el('strong', {}, 'Probably new. '), 'Nothing earlier is close. Triage it as a new problem.'))),
      el('h2', {}, examples.length ? 'Open an example' : 'Open an issue from the list'),
      examples.length ? el('div', { class: 'examples' }, ...examples.map(r => el('button', { type: 'button', class: 'example', onclick: () => showReport(repo, r.number) },
        el('span', { class: `stripe ${level(r.topScore)}`, 'aria-hidden': 'true' }),
        el('span', {}, el('span', { class: 'small faint', style: 'display:block' }, `#${r.number}, best match ${pct(r.topScore)}`), r.title)))) : null,
      el('p', { class: 'small muted', style: 'margin-top:22px' }, 'First time here? ', el('a', { href: '/guide.html' }, 'Read how to use it'), '. It takes two minutes.')));
  }

  // --- the report ---
  async function showReport(repo, number, create = false) {
    if (!validRepo(repo) || !/^\d+$/.test(String(number).trim())) { errorBox('Type an issue number, for example 52529.'); return; }
    number = String(number).trim();
    $('number').value = number;
    updateUrl(repo, number);
    markCurrent(number);
    $('report').replaceChildren();
    loading(create ? 'Triaging the issue. The AI checks take a few seconds…' : 'Opening the report…');
    try {
      // Creating a report spends LLM tokens, so the server only allows it with the admin token (header, never in the URL).
      const headers = create && adminToken() ? { 'X-Admin-Token': adminToken() } : {};
      const response = await fetch(`/reports/${repo}/${number}`, { method: create ? 'POST' : 'GET', headers });
      if (response.status === 404) {
        if (create) {
          setStatus(el('div', { class: 'note' }, `Issue #${number} isn't stored for ${repo}. Only issues the assistant has received can be triaged.`));
        } else if (!adminToken()) {
          setStatus(el('div', { class: 'note' }, `#${number} hasn't been triaged yet. Only existing reports can be viewed on the public demo.`));
        } else {
          setStatus(el('div', { class: 'note' }, `#${number} hasn't been triaged yet. `,
            el('button', { type: 'button', class: 'btn quiet', onclick: () => showReport(repo, number, true) }, 'Triage it now')));
        }
        return;
      }
      if (create && (response.status === 401 || response.status === 503)) {
        setStatus(el('div', { class: 'note' }, response.status === 401
          ? 'That admin token was not accepted. Only existing reports can be viewed on the public demo.'
          : 'Triaging new issues is switched off on this server (no admin token is configured).'));
        return;
      }
      if (!response.ok) throw new Error(`the server answered ${response.status}`);
      const report = await response.json();
      setStatus(null);
      render(report);
      $('report').querySelector('.tag')?.focus();   // the answer first, for keyboard and screen-reader users
      if (create) loadList();
    } catch (e) {
      errorBox('The report did not load (' + e.message + '). Check that the app is running, then try again.');
    }
  }

  /** The tag's answer: is this a duplicate? Colour AND words, never colour alone. */
  function verdict(r) {
    const top = (r.duplicates || [])[0];
    if (!top) return ['grey', 'No earlier issues', 'This is one of the first issues stored for this repository.'];
    const check = r.duplicateCheck;
    if (settings && rounded(top.score) >= settings.commentThreshold) {
      if (check && check.verdict === 'YES') return ['red', 'Likely duplicate', 'Very similar, and the AI check agrees.'];
      const said = check ? { NO: 'the AI check says it is a different problem', UNSURE: 'the AI check is not sure', UNKNOWN: 'the AI check could not decide' }[check.verdict] : 'the AI check did not run';
      return ['amber', 'Possible duplicate', `Very similar, but ${said}.`];
    }
    if (settings && rounded(top.score) >= settings.possibleThreshold) return ['amber', 'Possible duplicate', 'Similar to an earlier issue. Worth a look.'];
    return ['green', 'Probably new', 'Nothing earlier is close.'];
  }

  function scale(score) {
    const ticks = settings ? [settings.possibleThreshold, settings.commentThreshold] : [];
    return el('div', { class: 'scale', role: 'img', 'aria-label': `Similarity ${pct(score)}` },
      el('div', { class: `fill ${level(score)}`, style: `width:${Math.max(2, Math.min(100, score * 100))}%` }),
      ...ticks.map(t => el('div', { class: 'tick', style: `left:${t * 100}%` }, el('span', {}, pct(t)))));
  }

  /** For older issues: what maintainers actually decided (the answer key), as a stamp on the tag. */
  function stamp(r) {
    const original = r.issue.duplicateOf;
    if (original == null) return null;
    const rank = (r.duplicates || []).findIndex(d => d.number === original) + 1;
    let outcome;
    if (!r.issue.originalStored) outcome = el('span', {}, 'That number is a pull request or an issue the assistant doesn\'t store, so it could not be suggested.');
    else if (r.issue.originalIsNewer) outcome = el('span', {}, 'That issue was opened later, so the assistant could not have known it.');
    else if (rank > 0) outcome = el('span', {}, el('span', { class: 'hit' }, 'The assistant found it'), `, as match ${rank}.`);
    else outcome = el('span', {}, el('span', { class: 'miss' }, 'The assistant missed it'), ': it is not among the matches.');
    return el('div', { class: 'stamp' }, el('b', {}, 'Maintainers later closed this as a duplicate of ',
      link(`https://github.com/${r.repo}/issues/${original}`, `#${original}`)), outcome);
  }

  /** A calm note when the AI checks didn't run (no key, or today's budget used up). */
  function aiNote(r) {
    const notes = [r.notes, r.missing?.note, r.duplicateCheck?.reason, r.draftReply?.text].filter(Boolean).join(' ');
    if (/daily token budget/.test(notes)) {
      const resets = settings ? new Date(settings.budgetResetsAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' }) : 'midnight UTC';
      return `The AI checks were paused for this report (daily limit reached; it resets at ${resets}). Similar issues and labels don't use AI and are complete.`;
    }
    if (r.llmModel === 'fake') return 'This report was made without an AI key, so the details checklist and the draft are placeholders.';
    return null;
  }

  function render(r) {
    const card = r.issue;
    const parts = [];

    // Issue header
    parts.push(el('section', { class: 'issue-head' },
      el('div', { class: 'who' }, `Issue #${r.number}, opened ${fmtDate(card.createdAt)} by ${isTeam(card.authorAssociation) ? 'the team' : 'an outside reporter'}`),
      el('h1', {}, link(r.url, r.title)),
      el('div', { class: 'chips' }, el('span', { class: `chip ${card.state}` }, stateText(card.state, card.stateReason)),
        ...card.labels.map(l => el('span', { class: 'chip' }, l))),
      el('details', { class: 'fold' }, el('summary', {}, 'Read the issue'),
        el('pre', { class: 'issue-text' }, card.bodyStart || '(The reporter wrote no description.)'),
        card.bodyLength > card.bodyStart.length ? el('div', { class: 'small muted', style: 'margin-top:6px' }, 'Shortened. ', link(r.url, 'Read the rest on GitHub'), '.') : null)));

    const note = aiNote(r);
    if (note) parts.push(el('div', { class: 'note' }, note));

    // The tag
    const [colour, word, why] = verdict(r);
    const top = (r.duplicates || [])[0];
    const tagEl = el('section', { class: `tag ${colour} arrive`, role: 'status', tabindex: '-1', 'aria-label': `Verdict: ${word}` },
      el('div', { class: 'band' }, el('div', { class: 'verdict' }, word), el('div', { class: 'why' }, why)),
      top ? el('div', { class: 'body' },
        el('div', { class: 'score' }, pct(top.score), el('small', {}, 'similar')),
        scale(top.score),
        el('div', { class: 'match' }, 'Best match ', link(top.url, `#${top.number} ${top.title}`)),
        el('div', { class: 'ai' }, r.duplicateCheck
          ? `AI check: ${{ YES: 'same problem', NO: 'a different problem', UNSURE: 'not sure', UNKNOWN: 'no answer' }[r.duplicateCheck.verdict]}. ${r.duplicateCheck.reason}`
          : `AI check: only runs at ${settings ? pct(settings.commentThreshold) : '90%'} or more.`)) : null,
      stamp(r),
      card.state === 'closed' ? el('div', { class: 'small faint', style: 'padding:0 20px 18px' }, 'This issue is already closed. The tag shows what the assistant would have said when it was opened.') : null);

    // Evidence
    const rows = (r.duplicates || []).map(d => {
      const lv = level(d.score);
      return el('div', { class: 'row' },
        el('div', { class: 'top' }, el('div', {}, link(d.url, `#${d.number} ${d.title}`)), el('span', { class: 'pct' }, pct(d.score))),
        el('div', { class: 'state' }, `${levelWord[lv]}, ${stateText(d.state, d.stateReason)}`),
        el('div', { class: 'meter' }, el('div', { class: `fill ${lv}`, style: `width:${Math.max(2, d.score * 100)}%` })));
    });
    const similar = el('section', { class: 'panel' }, el('h2', {}, 'Earlier issues like this one'),
      r.fixedHint ? el('div', { class: 'fixed' }, el('strong', {}, 'Already fixed? '), r.fixedHint.text, ' ',
        r.fixedHint.closerUrl ? link(r.fixedHint.closerUrl, 'See the fix') : null) : null,
      ...(rows.length ? rows : [el('p', { class: 'muted', style: 'margin:0' }, 'None yet.')]));

    const m = r.missing || {};
    const names = { VERSION: 'Version', STEPS_TO_REPRODUCE: 'Steps to reproduce', EXPECTED_VS_ACTUAL: 'Expected and actual behaviour', LOGS_OR_STACK_TRACE: 'Logs or a stack trace' };
    const checklist = m.status !== 'OK'
      ? el('p', { class: 'muted', style: 'margin:0' }, 'Not checked: ' + (m.note || 'the AI check gave no answer') + '.')
      : el('ul', { class: 'checks' }, ...Object.keys(names).map(key => {
          const answer = m.details[key];
          const [mark, cls, hint] = answer === 'PRESENT' ? ['✓', 'given', 'given'] : answer === 'MISSING' ? ['✗', 'missing', 'missing, ask for it'] : ['–', 'na', 'not needed for this issue'];
          return el('li', {}, el('span', { class: `mark ${cls}`, 'aria-hidden': 'true' }, mark), el('span', {}, names[key], el('span', { class: 'hint-text' }, hint)));
        }));
    const labels = r.labels || [];
    const lower = el('div', { class: 'two' },
      el('section', { class: 'panel' }, el('h2', {}, 'What the reporter gave'), checklist),
      el('section', { class: 'panel' }, el('h2', {}, 'Suggested labels'),
        labels.length ? el('div', { class: 'labels' }, ...labels.map(l => el('span', { class: 'label', title: `${pct(l.share)} of similar issues have it` }, l.label)))
          : el('p', { class: 'muted', style: 'margin:0' }, 'No label stands out among similar issues.')));
    parts.push(el('div', { class: 'split' }, tagEl, el('div', { class: 'evidence' }, similar, lower)));

    // Draft reply
    const draft = r.draftReply || {};
    const draftSection = el('section', { class: 'panel' });
    const head = el('div', { class: 'draft-head' }, el('h2', { style: 'margin:0' }, 'Draft reply'));
    draftSection.append(head);
    if (draft.status === 'OK') {
      const copy = el('button', { type: 'button', class: 'btn quiet', onclick: async () => {
        try { await navigator.clipboard.writeText(draft.text); copy.textContent = 'Copied'; }
        catch { copy.textContent = 'Copy failed. Select the text instead.'; }
        setTimeout(() => { copy.textContent = 'Copy reply'; }, 2000);
      } }, 'Copy reply');
      head.append(copy);
      draftSection.append(el('p', { class: 'small muted', style: 'margin:6px 0 0' }, 'Edit it before posting. Nothing is posted automatically.'),
        el('pre', { class: 'draft' }, draft.text));
      if ((draft.unknownLinks || []).length) {
        draftSection.append(el('p', { class: 'small', style: 'color:var(--red)' }, 'Check these links, they are not among the sources: ' + draft.unknownLinks.join(', ')));
      }
    } else {
      draftSection.append(el('p', { class: 'muted', style: 'margin:8px 0 0' }, draft.text || 'No draft for this issue.'));
    }
    if ((draft.sources || []).length) {
      draftSection.append(el('details', { class: 'fold' }, el('summary', {}, `What the draft is based on (${draft.sources.length})`),
        el('ul', { class: 'small' }, ...draft.sources.map(s => el('li', {}, `${s.kind === 'docs' ? 'Docs' : 'Issue'}: `, link(s.url, s.title), el('span', { class: 'faint' }, ` (${pct(s.score)})`))))));
    }
    parts.push(draftSection);

    parts.push(el('footer', { class: 'meta' }, `Made ${new Date(r.createdAt).toLocaleString()} with ${r.llmModel}, ${r.costTokens.toLocaleString()} tokens, prompts ${r.promptVersions}.`));
    $('report').replaceChildren(...parts);
  }

  // --- wiring ---
  $('number-form').addEventListener('submit', (e) => { e.preventDefault(); showReport(repoValue(), $('number').value.trim()); });
  $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadList, 300); });
  $('repo').addEventListener('change', async () => { history.replaceState(null, '', '?' + new URLSearchParams({ repo: repoValue() })); renderWelcome(await loadList() || []); });
  $('admin-token').addEventListener('input', rememberToken);
  $('tab-reports').addEventListener('click', () => setTab('reports'));
  $('tab-all').addEventListener('click', () => setTab('all'));

  (async function start() {
    try { $('admin-token').value = sessionStorage.getItem('triage-admin-token') || ''; } catch { /* storage blocked */ }
    try { settings = await (await fetch('/settings')).json(); } catch { settings = null; }
    const params = new URLSearchParams(location.search);
    await loadRepos(params.get('repo'));
    const reports = await loadList();
    if (params.get('number')) showReport(repoValue(), params.get('number'));
    else renderWelcome(reports || []);
  })();
</script>
</body>
</html>
