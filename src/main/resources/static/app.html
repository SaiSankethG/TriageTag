<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriageTag: issue triage for maintainers</title>
<style>
  /* Design: the verdict is a triage tag (red / amber / blue / green band, punched hole, a stamp for what maintainers decided later).
     Everything around it stays quiet: cool clinical grey, white paper, ink text, one condensed face for headings. */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
  a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; width: 100%; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1, h2, .condensed { font-family: var(--condensed); font-stretch: 85%; }
  h1 { font-size: 30px; line-height: 1.15; font-weight: 600; margin: 0; letter-spacing: -.005em; max-width: 30ch; }
  h2 { font-size: 20px; line-height: 1.25; font-weight: 600; margin: 0 0 12px; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }

  /* Header */
  .bar { border-bottom: 1px solid var(--line); background: var(--paper); }
  .bar-inner { max-width: 1260px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .name { font-family: var(--condensed); font-stretch: 85%; font-size: 21px; font-weight: 600; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .name .swatches { display: inline-flex; gap: 3px; }
  .name .swatches i { width: 6px; height: 18px; border-radius: 2px; display: block; }
  .bar nav { margin-left: auto; display: flex; gap: 18px; }
  .bar nav a { color: var(--muted); text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  .bar nav a[aria-current="page"], .bar nav a:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* Layout */
  .layout { max-width: 1260px; margin: 0 auto; padding: 22px 16px 56px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; gap: 20px; } .list { max-height: 34vh; } }
  @media (min-width: 821px) { .picker { position: sticky; top: 16px; } }   /* sticky only beside the report, never on phones */

  /* Picker (the inbox on the left) */
  .picker { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .open-row { display: flex; gap: 8px; }
  .btn { border: 0; background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 6px; font-weight: 600; text-decoration: none; display: inline-block; }
  .btn.quiet { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.quiet:hover { box-shadow: inset 0 0 0 1px var(--ink); }
  .switch { display: flex; gap: 16px; margin: 16px 0 8px; border-bottom: 1px solid var(--line); }
  .switch button { border: 0; background: none; color: var(--muted); padding: 6px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; }
  .switch button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .filters button { font-size: 13px; border: 0; border-radius: 999px; padding: 3px 10px; background: var(--paper-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
  .filters button i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .open-only { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .open-only input { width: auto; }
  .list { list-style: none; margin: 6px -8px 0; padding: 0; max-height: 62vh; overflow-y: auto; overflow-x: hidden; }
  .list button { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 9px 8px; border-radius: 6px; }
  .list button:hover, .list button[aria-current="true"] { background: var(--paper-2); }
  .stripe { border-radius: 3px; background: var(--line); }
  .stripe.red { background: var(--red); } .stripe.amber { background: var(--amber); } .stripe.blue { background: var(--blue); } .stripe.green { background: var(--green); }
  .list .t, .example, .row a, .tag .match, .issue-head h1, .side pre, .side h3 { overflow-wrap: anywhere; }
  .list .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .list .w { font-size: 13px; font-weight: 600; }
  .list .w.red { color: var(--red); } .list .w.amber { color: var(--amber-text); } .list .w.blue { color: var(--blue); } .list .w.green { color: var(--green); }
  .list .w .faint { font-weight: 400; }
  .list .y { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .m { font-size: 12px; color: var(--faint); }
  .repo-select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
  @media (max-width: 820px) { #repo-chip { display: none; } }
  .to-list { display: none; font-size: 14px; margin-bottom: 10px; }
  @media (max-width: 820px) {
    body.reading main { order: -1; }                      /* phones: the report first, the list below it */
    body.reading .to-list { display: inline-block; }
  }

  /* Report */
  .report { display: grid; gap: 22px; }
  .issue-head .who { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .issue-head h1 a { color: var(--ink); text-decoration: none; }
  .issue-head h1 a:hover { text-decoration: underline; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--paper); white-space: nowrap; }
  .chip.open { border-color: var(--green); color: var(--green); }
  details.fold summary { cursor: pointer; color: var(--link); font-size: 14px; }
  details.fold[open] summary { margin-bottom: 10px; }

  .top-row { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 1060px) { .top-row { grid-template-columns: 1fr; } }

  /* The triage tag */
  .tag { position: relative; background: var(--paper); border-radius: 6px 6px 12px 12px; padding-top: 30px;
         clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%, 0 26px); outline: none; }
  .tag::before { content: ""; position: absolute; top: 9px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
                 background: var(--bg); box-shadow: inset 0 0 0 2px var(--line); }
  .tag .band { padding: 12px 20px 14px; color: var(--on-band); }
  .tag.red .band { background: var(--red-band); } .tag.amber .band { background: var(--amber); color: var(--on-amber); }
  .tag.blue .band { background: var(--blue-band); } .tag.green .band { background: var(--green-band); }
  .tag .band .verdict { font-family: var(--condensed); font-stretch: 85%; font-size: 32px; font-weight: 700; line-height: 1.1; }
  .tag .band .why { font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
  .tag .body { padding: 14px 20px 18px; display: grid; gap: 10px; }
  .tag .score { font-size: 14px; color: var(--muted); }
  .tag .score b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .gaps { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 3px; font-size: 14px; }
  .gaps li { display: grid; grid-template-columns: 18px 1fr; }
  .gaps .x { color: var(--red); font-weight: 800; } .gaps .ok { color: var(--green); font-weight: 800; }
  .stamp { margin: 0 20px 20px; padding: 10px 12px; border: 2px dashed var(--muted); border-radius: 6px; transform: rotate(-1.2deg);
           font-size: 14px; color: var(--ink); background: var(--paper-2); }
  .stamp b { font-family: var(--condensed); font-stretch: 85%; font-size: 16px; display: block; }
  .stamp .hit { color: var(--green); font-weight: 600; } .stamp .miss { color: var(--red); font-weight: 600; }

  /* Actions next to the tag */
  .actions { display: grid; gap: 14px; align-content: start; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .labels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .label { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--ink); }

  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .draft { white-space: pre-wrap; word-break: break-word; margin: 10px 0 0; padding: 14px 16px; border-left: 3px solid var(--ink);
           background: var(--paper-2); border-radius: 0 8px 8px 0; font: 15px/1.65 var(--body); max-width: 78ch; }

  /* This issue next to its best match */
  .side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .side { grid-template-columns: 1fr; } }
  .side > div { background: var(--paper-2); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .side h3 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .side .sub { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .side pre { white-space: pre-wrap; margin: 0; font: 14px/1.55 var(--body); max-height: 320px; overflow: auto; }
  .fixed { background: var(--amber-tint); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .row { padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; padding-top: 2px; }
  .row .top { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  .row .pct { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .state { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .meter > div.grey { background: var(--muted); }
  dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  dl.meta dt { color: var(--muted); } dl.meta dd { margin: 0; overflow-wrap: anywhere; }

  /* Welcome */
  .welcome { padding: 8px 0; max-width: 760px; }
  .welcome h1 { font-size: 40px; max-width: 18ch; }
  .welcome .lede { font-size: 17px; color: var(--muted); max-width: 60ch; margin: 12px 0 26px; }
  .legend { display: grid; gap: 10px; margin: 0 0 28px; max-width: 560px; }
  .legend div { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; }
  .legend i { width: 10px; height: 100%; min-height: 22px; border-radius: 3px; display: block; }
  .examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .examples { grid-template-columns: 1fr; } .welcome h1 { font-size: 32px; } }
  .example { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink); display: grid; grid-template-columns: 6px 1fr; gap: 12px; }
  .example:hover { border-color: var(--ink); }

  .note { background: var(--paper); border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 12px 14px; }
  .error { background: var(--red-tint); color: var(--red); border-radius: 8px; padding: 12px 14px; }
  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="name" href="/" aria-label="TriageTag, home">
      <span class="swatches" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--amber)"></i><i style="background:var(--green)"></i></span>
      TriageTag
    </a>
    <span class="small muted" id="repo-chip"></span>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/app.html" aria-current="page">Reports</a>
      <a href="/guide.html">How to use</a>
    </nav>
  </div>
</header>

<div class="layout">
  <aside class="picker" id="picker" aria-labelledby="pick-heading">
    <h2 id="pick-heading" class="visually-hidden">Choose an issue</h2>
    <label for="repo" class="small muted" style="display:block;margin-bottom:4px">Repository</label>
    <select id="repo" class="repo-select"><option value="spring-projects/spring-boot">spring-projects/spring-boot</option></select>
    <div id="repo-count" class="small faint" style="margin-top:4px" aria-live="polite"></div>
    <form id="number-form" class="open-row" style="margin-top:12px">
      <label for="number" class="visually-hidden">Issue number</label>
      <!-- Text, not type=number: no up/down arrows; only digits are accepted when opening. -->
      <input id="number" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Issue number">
      <button id="show" class="btn" type="submit">Open</button>
    </form>
    <div class="switch" role="tablist" aria-label="Which issues">
      <button id="tab-reports" role="tab" aria-selected="true" type="button">Triaged</button>
      <button id="tab-all" role="tab" aria-selected="false" type="button">All issues</button>
    </div>
    <div id="filter-box">
      <div class="filters" id="filters" role="group" aria-label="Show only"></div>
      <label class="open-only"><input type="checkbox" id="open-only"> Open issues only</label>
    </div>
    <div id="search-box" hidden>
      <label for="search" class="visually-hidden">Search titles</label>
      <input id="search" type="search" placeholder="Search titles, e.g. datasource" autocomplete="off">
    </div>
    <div id="list-status" class="small faint" aria-live="polite" style="margin-top:8px"></div>
    <ul id="issue-list" class="list stagger" aria-label="Issues"></ul>
  </aside>

  <main>
    <a class="to-list" href="#picker">Back to the list</a>
    <div id="status" aria-live="polite"></div>
    <div id="report" class="report"></div>
  </main>
</div>

<script>
  // Every piece of issue or LLM text is inserted with textContent (via el()), never as HTML.
  const $ = (id) => document.getElementById(id);
  let settings = null;          // from GET /settings: thresholds, model, budget
  let searchTimer = null;
  let tab = 'reports';          // which list the picker shows
  let filter = 'all';           // which kind of triaged issue the list shows
  let repoList = [];            // GET /repos, for the counts under the picker
  let triaged = [];             // the last loaded triaged list; filters run on the page

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null) continue;
      if (key === 'class') node.className = value;
      else if (key === 'style') node.style.cssText = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children) {
      if (child != null && child !== false) node.append(child instanceof Node ? child : String(child));
    }
    return node;
  }

  function link(url, text) {
    return /^https?:\/\//.test(url || '') ? el('a', { href: url, target: '_blank', rel: 'noopener' }, text) : text;
  }

  // Scores are shown with one decimal (0.825 -> "82.5%"); kinds use the same rounded value, so "75%" is never "Looks new".
  const rounded = (score) => Math.round(score * 1000) / 1000;
  const pct = (score) => `${Math.round(score * 1000) / 10}%`;
  const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

  // --- the four words a maintainer sees instead of percentages ---
  const KINDS = {
    likely: { word: 'Likely duplicate', colour: 'red' },
    possible: { word: 'Possible duplicate', colour: 'amber' },
    info: { word: 'Needs info', colour: 'blue' },
    new: { word: 'Looks new', colour: 'green' },
  };
  const MISSING_NAMES = { VERSION: 'version', STEPS_TO_REPRODUCE: 'steps to reproduce', EXPECTED_VS_ACTUAL: 'expected vs actual behaviour', LOGS_OR_STACK_TRACE: 'logs' };
  const CHECK_WORDS = { YES: 'same problem', NO: 'a different problem', UNSURE: 'not sure', UNKNOWN: 'no answer' };

  /**
   * One shape for both a list line and a full report: { score, topNumber, topTitle, verdict, reason, missing }.
   * Likely duplicate = very similar AND the AI check agrees; Possible = similar; Needs info = not a duplicate but details are
   * missing; Looks new = neither. A duplicate wins over missing details: closing it as a duplicate is the bigger saving.
   */
  function kindOf(t) {
    const possible = settings ? settings.possibleThreshold : 0.75;
    const high = settings ? settings.commentThreshold : 0.90;
    if (t.score != null && rounded(t.score) >= high && t.verdict === 'YES') return 'likely';
    if (t.score != null && rounded(t.score) >= possible) return 'possible';
    if (t.missing.length) return 'info';
    return 'new';
  }

  /** The one-line "why" next to the word. */
  function whyOf(kind, t) {
    const missingText = (keys) => 'Missing: ' + keys.map(k => MISSING_NAMES[k] || k.toLowerCase()).join(', ') + '.';
    if (kind === 'likely') return t.reason || `Same problem as #${t.topNumber}.`;
    if (kind === 'possible') {
      if (t.verdict && t.verdict !== 'YES') return `Very similar to #${t.topNumber}, but the AI check says: ${CHECK_WORDS[t.verdict]}.`;
      return `Similar to #${t.topNumber}: ${t.topTitle || 'an earlier issue'}.`;
    }
    if (kind === 'info') return missingText(t.missing);
    return t.topNumber != null ? 'No earlier issue is close, and nothing important is missing.' : 'No earlier issues to compare with yet.';
  }

  /** A list line from GET /reports/{repo}. */
  const fromListItem = (r) => ({ score: r.topScore, topNumber: r.topNumber, topTitle: r.topTitle, verdict: r.checkVerdict,
    reason: r.checkReason, missing: r.missing || [] });
  /** The same from a full report. */
  function fromReport(r) {
    const top = (r.duplicates || [])[0];
    const m = r.missing || {};
    return { score: top ? top.score : null, topNumber: top ? top.number : null, topTitle: top ? top.title : null,
      verdict: r.duplicateCheck ? r.duplicateCheck.verdict : null, reason: r.duplicateCheck ? r.duplicateCheck.reason : null,
      missing: m.status === 'OK' ? Object.keys(MISSING_NAMES).filter(k => m.details[k] === 'MISSING') : [] };
  }

  const isTeam = (association) => ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association);
  function stateText(state, reason) {
    if (state !== 'closed') return 'open';
    return { completed: 'closed as fixed', not_planned: 'closed as not planned', duplicate: 'closed as a duplicate' }[reason] || 'closed';
  }

  function setStatus(node) { $('status').replaceChildren(...(node ? [node] : [])); }
  function loading(text) { setStatus(el('div', { class: 'note' }, el('span', { class: 'spinner', 'aria-hidden': 'true' }), text)); }
  function errorBox(text) { setStatus(el('div', { class: 'error', role: 'alert' }, text)); }

  function repoValue() { return $('repo').value.trim(); }
  function validRepo(repo) { return /^[\w.-]+\/[\w.-]+$/.test(repo); }

  // --- URL: ?repo=owner/name&number=123, so a report can be shared or bookmarked ---
  function updateUrl(repo, number) {
    const params = new URLSearchParams({ repo, number: String(number) });
    history.replaceState(null, '', `?${params}`);
  }

  // --- repositories: the switcher lists every repository the assistant has issues for ---
  async function loadRepos(preferred) {
    let repos = [];
    // An older server has no GET /repos (it answers 404 with an error object): fall back to the default repository.
    try { const response = await fetch('/repos'); repos = response.ok ? await response.json() : []; } catch { repos = []; }
    if (!Array.isArray(repos)) repos = [];
    const names = repos.map(r => r.repo);
    const chosen = preferred && validRepo(preferred) ? preferred : (names[0] || 'spring-projects/spring-boot');
    if (!names.includes(chosen)) names.unshift(chosen);
    $('repo').replaceChildren(...names.map(name => {
      const r = repos.find(x => x.repo === name);
      return el('option', { value: name }, name);
    }));
    $('repo').value = chosen;
    repoList = repos;
    showRepoCount();
  }

  /** "33 triaged of 43,810 issues" under the picker, for the repository chosen now. */
  function showRepoCount() {
    const r = repoList.find(x => x.repo === repoValue());
    $('repo-count').textContent = r ? `${r.triaged.toLocaleString()} triaged of ${r.issues.toLocaleString()} issues` : '';
  }

  // --- the picker list ---
  function setTab(which) {
    tab = which;
    $('tab-reports').setAttribute('aria-selected', String(which === 'reports'));
    $('tab-all').setAttribute('aria-selected', String(which === 'all'));
    $('search-box').hidden = which !== 'all';
    $('filter-box').hidden = which !== 'reports';
    loadList();
  }

  function listItem(number, title, colour, lines, onClick, index = 0) {
    return el('li', { style: `--i:${index}` }, el('button', { type: 'button', 'data-number': number, onclick: onClick },
      el('span', { class: `stripe ${colour || ''}`, 'aria-hidden': 'true' }),
      el('span', { style: 'min-width:0' }, el('span', { class: 't' }, el('span', { class: 'faint num' }, `#${number} `), title), ...lines)));
  }

  /** Filter buttons with counts, then the triaged list as filtered (open issues come first from the server). */
  function renderTriaged() {
    const repo = repoValue();
    const openOnly = $('open-only').checked;
    const items = triaged.map(r => ({ r, t: fromListItem(r) })).map(x => ({ ...x, kind: kindOf(x.t) }))
      .filter(x => !openOnly || x.r.state === 'open');
    const count = (k) => items.filter(x => k === 'all' || x.kind === k).length;
    $('filters').replaceChildren(...['all', 'likely', 'possible', 'info', 'new'].map(k => el('button', {
      type: 'button', 'aria-pressed': String(filter === k), onclick: () => { filter = k; renderTriaged(); } },
      k === 'all' ? null : el('i', { style: `background:var(--${KINDS[k].colour})`, 'aria-hidden': 'true' }),
      `${k === 'all' ? 'All' : KINDS[k].word} ${count(k)}`)));
    const shown = items.filter(x => filter === 'all' || x.kind === filter);
    $('issue-list').replaceChildren(...shown.map(({ r, t, kind }, i) => listItem(r.number, r.title, KINDS[kind].colour, [
      el('span', { class: `w ${KINDS[kind].colour}`, style: 'display:block' }, KINDS[kind].word,
        r.state === 'closed' ? el('span', { class: 'faint' }, ', closed') : null),
      el('span', { class: 'y', style: 'display:block' }, whyOf(kind, t))], () => showReport(repo, r.number), i)));
    $('list-status').textContent = !triaged.length ? 'No issue has been triaged yet.'
      : shown.length ? 'Open issues first, then the newest.' : 'Nothing matches this filter.';
    markCurrent($('number').value);
  }

  async function loadList() {
    const repo = repoValue();
    $('repo-chip').textContent = validRepo(repo) ? repo : '';
    if (!validRepo(repo)) { $('list-status').textContent = 'Choose a repository.'; return []; }
    $('list-status').textContent = 'Loading…';
    try {
      if (tab === 'reports') {
        const response = await fetch(`/reports/${repo}?limit=50`);
        if (!response.ok) throw new Error(`server answered ${response.status}`);
        triaged = await response.json();
        renderTriaged();
        return triaged;
      }
      const q = $('search').value.trim();
      const params = new URLSearchParams({ size: '50' });
      if (q) params.set('q', q);
      const response = await fetch(`/repos/${repo}/issues?${params}`);
      if (!response.ok) throw new Error(`server answered ${response.status}`);
      const page = await response.json();
      $('issue-list').replaceChildren(...page.issues.map((issue, i) => listItem(issue.number, issue.title, null,
        [el('span', { class: 'm', style: 'display:block' }, `${issue.state}, ${fmtDate(issue.createdAt)}${isTeam(issue.authorAssociation) ? ', by the team' : ''}${issue.hasReport ? ', triaged' : ''}`)],
        () => showReport(repo, issue.number), i)));
      $('list-status').textContent = page.total === 0
        ? (q ? `No titles contain "${q}".` : 'No stored issues for this repository.')
        : `${q ? 'Matching' : 'Newest'} ${page.issues.length} of ${page.total.toLocaleString()}`;
    } catch (e) {
      $('list-status').textContent = 'The list did not load (' + e.message + '). Is the app running?';
    }
    return [];
  }

  function markCurrent(number) {
    for (const b of document.querySelectorAll('#issue-list button')) {
      b.setAttribute('aria-current', String(b.dataset.number === String(number)));
    }
  }

  // --- the welcome view (nothing opened yet) ---
  function renderWelcome(reports) {
    const repo = repoValue();
    const examples = reports.map(r => ({ r, kind: kindOf(fromListItem(r)) })).filter(x => x.kind === 'likely' || x.kind === 'possible').slice(0, 4);
    const t = settings ? [pct(settings.commentThreshold), pct(settings.possibleThreshold)] : ['90%', '75%'];
    document.body.classList.remove('reading');
    $('report').replaceChildren(el('section', { class: 'welcome' },
      el('h1', {}, 'Triage new issues before you open them'),
      el('p', { class: 'lede' }, 'Each triaged issue gets one of four words. Pick an issue on the left to see why, a draft reply, and the earlier issue it looks like.'),
      el('div', { class: 'legend' },
        el('div', {}, el('i', { style: 'background:var(--red)' }), el('span', {}, el('strong', {}, 'Likely duplicate. '), `Very similar to an earlier issue (${t[0]} or more), and an AI check agrees it is the same problem.`)),
        el('div', {}, el('i', { style: 'background:var(--amber)' }), el('span', {}, el('strong', {}, 'Possible duplicate. '), `Similar to an earlier issue (${t[1]} or more). Worth a look before you answer.`)),
        el('div', {}, el('i', { style: 'background:var(--blue)' }), el('span', {}, el('strong', {}, 'Needs info. '), 'Not a duplicate, but the reporter left out something you need, like the version.')),
        el('div', {}, el('i', { style: 'background:var(--green)' }), el('span', {}, el('strong', {}, 'Looks new. '), 'Nothing earlier is close and nothing important is missing.'))),
      el('h2', {}, examples.length ? 'Open an example' : 'Open an issue from the list'),
      examples.length ? el('div', { class: 'examples' }, ...examples.map(({ r, kind }) => el('button', { type: 'button', class: 'example', onclick: () => showReport(repo, r.number) },
        el('span', { class: `stripe ${KINDS[kind].colour}`, 'aria-hidden': 'true' }),
        el('span', {}, el('span', { class: 'small faint', style: 'display:block' }, el('span', { class: 'num' }, `#${r.number}`), `, ${KINDS[kind].word.toLowerCase()}`), r.title)))) : null,
      el('p', { class: 'small muted', style: 'margin-top:22px' }, 'First time here? ', el('a', { href: '/guide.html' }, 'Read how to use it'), '. It takes two minutes.')));
  }

  // --- the report (read only: creating reports is on the admin page, which is not public) ---
  async function showReport(repo, number) {
    if (!validRepo(repo) || !/^\d+$/.test(String(number).trim())) { errorBox('Type an issue number, for example 52529.'); return; }
    number = String(number).trim();
    $('number').value = number;
    updateUrl(repo, number);
    markCurrent(number);
    document.body.classList.add('reading');
    $('report').replaceChildren();
    loading('Opening the report…');
    if (window.matchMedia('(max-width: 820px)').matches) window.scrollTo(0, 0);
    try {
      const response = await fetch(`/reports/${repo}/${number}`);
      if (response.status === 404) {
        setStatus(el('div', { class: 'note' }, `#${number} has no report yet. New issues are triaged automatically when they are opened.`));
        return;
      }
      if (!response.ok) throw new Error(`the server answered ${response.status}`);
      const report = await response.json();
      setStatus(null);
      render(report);
      $('report').querySelector('.tag')?.focus();   // the answer first, for keyboard and screen-reader users
    } catch (e) {
      errorBox('The report did not load (' + e.message + '). Check that the app is running, then try again.');
    }
  }

  /** For older issues: what maintainers actually decided (the answer key), as a stamp on the tag. */
  function stamp(r) {
    const original = r.issue.duplicateOf;
    if (original == null) return null;
    const rank = (r.duplicates || []).findIndex(d => d.number === original) + 1;
    let outcome;
    if (!r.issue.originalStored) outcome = el('span', {}, 'That number is a pull request or an issue the assistant doesn\'t store, so it could not be suggested.');
    else if (r.issue.originalIsNewer) outcome = el('span', {}, 'That issue was opened later, so the assistant could not have known it.');
    else if (rank > 0) outcome = el('span', {}, el('span', { class: 'hit' }, 'The assistant found it'), `, as match ${rank}.`);
    else outcome = el('span', {}, el('span', { class: 'miss' }, 'The assistant missed it'), ': it is not among the matches.');
    return el('div', { class: 'stamp' }, el('b', {}, 'Maintainers later closed this as a duplicate of ',
      link(`https://github.com/${r.repo}/issues/${original}`, `#${original}`)), outcome);
  }

  /** A calm note when the AI checks didn't run (no key, or today's budget used up). */
  function aiNote(r) {
    const notes = [r.notes, r.missing?.note, r.duplicateCheck?.reason, r.draftReply?.text].filter(Boolean).join(' ');
    if (/daily token budget/.test(notes)) {
      const resets = settings ? new Date(settings.budgetResetsAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' }) : 'midnight UTC';
      return `The AI checks were paused for this report (daily limit reached; it resets at ${resets}). Similar issues and labels don't use AI and are complete.`;
    }
    if (r.llmModel === 'fake') return 'This report was made without an AI key, so the details check and the draft are placeholders.';
    return null;
  }

  /** A thin bar that fills to the similarity (the fill is animated in theme.css). */
  function meter(score, colour) {
    return el('div', { class: 'meter', role: 'img', 'aria-label': `Similarity ${pct(score)}` },
      el('div', { class: colour, style: `--w:${Math.max(2, Math.min(100, score * 100))}%` }));
  }

  /** A button that copies text and says "Copied" for two seconds. */
  function copyButton(label, text, primary) {
    const button = el('button', { type: 'button', class: primary ? 'btn' : 'btn quiet', onclick: async () => {
      try { await navigator.clipboard.writeText(text); button.textContent = 'Copied'; }
      catch { button.textContent = 'Copy failed'; }
      setTimeout(() => { button.textContent = label; }, 2000);
    } }, label);
    return button;
  }

  function render(r) {
    const card = r.issue;
    const t = fromReport(r);
    const kind = kindOf(t);
    const top = (r.duplicates || [])[0];
    const draft = r.draftReply || {};
    const m = r.missing || {};
    const parts = [];

    // Which issue this is (one line), then the answer
    parts.push(el('section', { class: 'issue-head' },
      el('div', { class: 'who' }, el('span', { class: 'num' }, `#${r.number}`), `, opened ${fmtDate(card.createdAt)} by ${isTeam(card.authorAssociation) ? 'the team' : 'an outside reporter'}, `,
        el('span', { class: `chip ${card.state}` }, stateText(card.state, card.stateReason))),
      el('h1', {}, link(r.url, r.title))));
    const note = aiNote(r);
    if (note) parts.push(el('div', { class: 'note' }, note));

    // 1. The tag: the word big, the percentage small, then only what is missing
    const gaps = m.status !== 'OK'
      ? el('ul', { class: 'gaps' }, el('li', {}, el('span', { 'aria-hidden': 'true' }, '–'), 'Missing details not checked.'))
      : el('ul', { class: 'gaps', 'aria-label': 'Missing details' }, ...(t.missing.length
        ? t.missing.map(k => el('li', {}, el('span', { class: 'x', 'aria-hidden': 'true' }, '✗'), `${MISSING_NAMES[k][0].toUpperCase()}${MISSING_NAMES[k].slice(1)} missing`))
        : [el('li', {}, el('span', { class: 'ok', 'aria-hidden': 'true' }, '✓'), 'Nothing important missing')]));
    const tagEl = el('section', { class: `tag ${KINDS[kind].colour} swing`, role: 'status', tabindex: '-1', 'aria-label': `Verdict: ${KINDS[kind].word}` },
      el('div', { class: 'band' }, el('div', { class: 'verdict' }, KINDS[kind].word), el('div', { class: 'why' }, whyOf(kind, t))),
      el('div', { class: 'body' },
        top ? el('div', { class: 'score' }, el('b', {}, pct(top.score)), ' similar to ', link(top.url, el('span', { class: 'num' }, `#${top.number}`))) : null,
        top ? meter(top.score, KINDS[kind].colour) : null,
        gaps),
      stamp(r),
      card.state === 'closed' ? el('div', { class: 'small faint', style: 'padding:0 20px 18px' }, 'Already closed. The tag shows what the assistant would have said when it was opened.') : null);

    // 2. The buttons a maintainer needs next. Nothing is posted by the app: they copy, then paste on GitHub.
    const offerDuplicate = top && (kind === 'likely' || kind === 'possible');
    const buttons = el('div', { class: 'buttons' },
      draft.status === 'OK' ? copyButton('Copy reply', draft.text, true) : null,
      offerDuplicate ? copyButton(`Copy "Duplicate of #${top.number}"`, `Duplicate of #${top.number}`, false) : null,
      /^https?:\/\//.test(r.url || '') ? el('a', { class: 'btn quiet', href: r.url, target: '_blank', rel: 'noopener' }, 'Open on GitHub') : null);
    const labels = r.labels || [];
    parts.push(el('div', { class: 'top-row' }, tagEl, el('div', { class: 'actions' }, buttons,
      el('p', { class: 'small muted', style: 'margin:0' }, 'Nothing is posted for you. Copy, then paste on GitHub.',
        offerDuplicate ? ` Posting "Duplicate of #${top.number}" lets GitHub close the issue as a duplicate.` : null),
      labels.length ? el('div', { class: 'labels' }, 'Suggested labels:', ...labels.map(l => el('span', { class: 'label', title: `${pct(l.share)} of similar issues have it` }, l.label))) : null)));

    // 3. The draft
    const draftSection = el('section', { class: 'panel' }, el('h2', { style: 'margin:0' }, 'Draft reply'));
    if (draft.status === 'OK') {
      draftSection.append(el('pre', { class: 'draft' }, draft.text));
      if ((draft.unknownLinks || []).length) {
        draftSection.append(el('p', { class: 'small', style: 'color:var(--red)' }, 'Check these links, they are not among the sources: ' + draft.unknownLinks.join(', ')));
      }
    } else {
      draftSection.append(el('p', { class: 'muted', style: 'margin:8px 0 0' }, draft.text || 'No draft for this issue.'));
    }
    if ((draft.sources || []).length) {
      draftSection.append(el('details', { class: 'fold', style: 'margin-top:10px' }, el('summary', {}, `What the draft is based on (${draft.sources.length})`),
        el('ul', { class: 'small', style: 'margin:0' }, ...draft.sources.map(s => el('li', {}, `${s.kind === 'docs' ? 'Docs' : 'Issue'}: `, link(s.url, s.title))))));
    }
    parts.push(draftSection);

    // 4. This issue next to its best match, so the maintainer can judge in one look
    if (top) {
      const cut = (text, full) => (text || '').trim() ? text + (full > text.length ? '…' : '') : '(No description.)';
      parts.push(el('section', { class: 'panel' }, el('h2', {}, 'This issue and its best match'),
        r.fixedHint ? el('div', { class: 'fixed' }, el('strong', {}, 'Already fixed? '), r.fixedHint.text, ' ',
          r.fixedHint.closerUrl ? link(r.fixedHint.closerUrl, 'See the fix') : null) : null,
        el('div', { class: 'side' },
          el('div', {}, el('h3', {}, 'This issue, ', el('span', { class: 'num' }, `#${r.number}`)), el('div', { class: 'sub' }, `${stateText(card.state, card.stateReason)}, opened ${fmtDate(card.createdAt)}`),
            el('pre', {}, cut(card.bodyStart.slice(0, 600), card.bodyLength))),
          el('div', {}, el('h3', {}, link(top.url, `#${top.number} ${top.title}`)),
            el('div', { class: 'sub' }, `${pct(top.score)} similar, ${stateText(top.state, top.stateReason)}${top.createdAt ? `, opened ${fmtDate(top.createdAt)}` : ''}`),
            el('pre', {}, top.bodyStart != null ? cut(top.bodyStart, top.bodyStart.length >= 600 ? 601 : 0) : '(Not stored.)')))));
    }

    // 5. The other matches, folded
    const others = (r.duplicates || []).slice(1);
    if (others.length) {
      parts.push(el('details', { class: 'panel fold' }, el('summary', {}, `Other similar issues (${others.length})`),
        ...others.map(d => el('div', { class: 'row' },
          el('div', { class: 'top' }, el('div', {}, link(d.url, `#${d.number} ${d.title}`)), el('span', { class: 'pct' }, pct(d.score))),
          el('div', { class: 'state' }, stateText(d.state, d.stateReason)), meter(d.score, 'grey')))));
    }

    // 6. Details for the curious: the AI check, model, tokens
    parts.push(el('details', { class: 'panel fold' }, el('summary', {}, 'Details'),
      el('dl', { class: 'meta' },
        el('dt', {}, 'AI check'), el('dd', {}, r.duplicateCheck ? `${CHECK_WORDS[r.duplicateCheck.verdict]}. ${r.duplicateCheck.reason || ''}` : `only runs at ${settings ? pct(settings.commentThreshold) : '90%'} or more`),
        el('dt', {}, 'Made'), el('dd', {}, new Date(r.createdAt).toLocaleString()),
        el('dt', {}, 'Model'), el('dd', {}, r.llmModel),
        el('dt', {}, 'Tokens'), el('dd', {}, r.costTokens.toLocaleString()),
        el('dt', {}, 'Prompts'), el('dd', {}, r.promptVersions || '–'))));

    $('report').replaceChildren(...parts);
  }

  // --- wiring ---
  $('number-form').addEventListener('submit', (e) => { e.preventDefault(); showReport(repoValue(), $('number').value.trim()); });
  $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadList, 300); });
  $('repo').addEventListener('change', async () => { showRepoCount(); history.replaceState(null, '', '?' + new URLSearchParams({ repo: repoValue() })); renderWelcome(await loadList() || []); });
  $('open-only').addEventListener('change', renderTriaged);
  $('tab-reports').addEventListener('click', () => setTab('reports'));
  $('tab-all').addEventListener('click', () => setTab('all'));

  (async function start() {
    try { settings = await (await fetch('/settings')).json(); } catch { settings = null; }
    const params = new URLSearchParams(location.search);
    await loadRepos(params.get('repo'));
    const reports = await loadList();
    if (params.get('number')) showReport(repoValue(), params.get('number'));
    else renderWelcome(reports || []);
  })();

  // The tag swings again when you point at it or click it; links and buttons on it still work as normal.
  // The motion itself lives in theme.css and is off under prefers-reduced-motion.
  function nudgeTag(event) {
    const tag = event.target.closest('.tag');
    if (!tag || event.target.closest('a, button')) return;
    if (event.type === 'mouseover' && tag.contains(event.relatedTarget)) return;   // still inside the same tag
    if (tag.classList.contains('nudge')) return;                                      // let the swing finish
    tag.classList.remove('swing');
    void tag.offsetWidth;                                                             // restart the animation
    tag.classList.add('nudge');
    const done = () => tag.classList.remove('nudge');
    tag.addEventListener('animationend', done, { once: true });
    setTimeout(done, 1000);                                                           // also when no animation runs (reduced motion)
  }
  document.addEventListener('mouseover', nudgeTag);
  document.addEventListener('click', nudgeTag);
</script>
</body>
</html>
