<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · TriageTag</title>
<style>
  /* Not public: the Ingress doesn't route /admin.html, so this works only on a local run or through a port-forward. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
  a { color: var(--link); }
  :focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 4px; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-family: var(--display); font-stretch: 85%; font-size: 30px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  form { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; margin-top: 20px; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
  input { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; }
  button { font: inherit; border: 0; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; justify-self: start; }
  #result { margin-top: 16px; }
  .error { color: var(--red); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>
<main>
  <h1>Admin: triage an issue</h1>
  <p class="muted">Creates or refreshes a report. This spends AI tokens, so the server asks for the admin token. The token stays in this
    tab only and is sent as a header, never in the address.</p>
  <form id="form">
    <label>Repository <input id="repo" value="spring-projects/spring-boot" autocomplete="off" required></label>
    <!-- Text, not type=number: no up/down arrows; digits are checked before sending. -->
    <label>Issue number <input id="number" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required></label>
    <label>Admin token <input id="admin-token" type="password" autocomplete="off" required></label>
    <button type="submit">Triage it</button>
  </form>
  <div id="result" aria-live="polite"></div>
  <p><a href="/app.html">Back to the reports</a></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function adminToken() { return $('admin-token').value.trim(); }
  try { $('admin-token').value = sessionStorage.getItem('triage-admin-token') || ''; } catch { /* storage blocked */ }
  $('admin-token').addEventListener('input', () => {
    try { sessionStorage.setItem('triage-admin-token', adminToken()); } catch { /* storage blocked: keep it in the field only */ }
  });

  function say(text, isError, href) {
    const p = document.createElement('p');
    if (isError) p.className = 'error';
    p.textContent = text;
    if (href) { const a = document.createElement('a'); a.href = href; a.textContent = ' Open the report'; p.append(a); }
    $('result').replaceChildren(p);
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const repo = $('repo').value.trim(), number = $('number').value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !/^\d+$/.test(number)) { say('Use a repository like owner/name and a number.', true); return; }
    say('Triaging. The AI checks take a few seconds…');
    try {
      const response = await fetch(`/reports/${repo}/${number}`, { method: 'POST', headers: { 'X-Admin-Token': adminToken() } });
      if (response.status === 401) return say('That admin token was not accepted.', true);
      if (response.status === 503) return say('Triaging is switched off on this server (no admin token is configured).', true);
      if (response.status === 404) return say(`Issue #${number} isn't stored for ${repo}.`, true);
      if (!response.ok) return say(`The server answered ${response.status}.`, true);
      say(`Done: #${number} is triaged.`, false, `/app.html?${new URLSearchParams({ repo, number })}`);
    } catch (err) {
      say('The request failed (' + err.message + '). Is the app running?', true);
    }
  });
</script>
</body>
</html>
