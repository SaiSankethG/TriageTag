services:
  postgres:
    # Postgres 16 + the pgvector extension. "-trixie" = Debian 13, the same OS (glibc 2.41) as the postgres:16 image
    # the data was created with; the plain pg16 tag is Debian 12 (glibc 2.36), which warns about a collation mismatch.
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 on the Mac is taken by a local Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One Kafka broker in KRaft mode: it is its own controller, so no ZooKeeper is needed.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # this one node does both jobs
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092   # the address clients on the Mac use
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Only one broker, so every internal topic can have only 1 copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the app (NewTopic beans), so a typo in a topic name fails instead of creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # No volume: Kafka's data is lost when the container is removed. Fine for development, because
    # Postgres is the source of truth and the app re-creates the topics when it starts.

volumes:
  pgdata:
