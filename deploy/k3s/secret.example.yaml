# TEMPLATE ONLY: copy to secret.yaml (git-ignored), fill in the values on the server, then:
#   kubectl apply -f deploy/k3s/secret.yaml
# Never commit the filled-in file. stringData = plain text here; Kubernetes stores it base64-encoded.
apiVersion: v1
kind: Secret
metadata:
  name: triage-secrets
  namespace: triage
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-long-random"        # e.g. openssl rand -base64 24
  GITHUB_TOKEN: "github_pat_..."                    # read-only, public repos (backfill, GraphQL)
  GITHUB_WEBHOOK_SECRET: "change-me-long-random"    # the same value as in the GitHub App's webhook settings
  ANTHROPIC_API_KEY: "sk-ant-..."                   # the LLM key, with a monthly spend cap in the Anthropic console
  GITHUB_APP_ID: "123456"                           # from the GitHub App's settings page (comment mode only)
  TRIAGE_ADMIN_TOKEN: "change-me-long-random"       # admin calls (backfill, eval, POST /reports): generate with openssl rand -hex 32
---
# The GitHub App's private key (.pem) as a file. Create it from the downloaded key instead of pasting it here:
#   kubectl -n triage create secret generic github-app-key --from-file=private-key.pem=/path/to/app.private-key.pem
