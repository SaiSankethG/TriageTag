# The triage assistant: webhook receiver + Kafka worker + API + demo page, one replica.
apiVersion: v1
kind: Service
metadata:
  name: triage-app
  namespace: triage
spec:
  selector:
    app: triage-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-app
  namespace: triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-app
  template:
    metadata:
      labels:
        app: triage-app
    spec:
      containers:
        - name: app
          # Built on the Mac with ./mvnw spring-boot:build-image (linux/arm64) and imported into k3s
          # (docker save | gzip, copy to the VM, sudo k3s ctr images import): no registry needed.
          image: docker.io/library/issue-triage-assistant:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/triage" }
            - { name: SPRING_DATASOURCE_USERNAME, value: "copilot" }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: triage-secrets, key: POSTGRES_PASSWORD } }
            - { name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: triage-secrets, key: GITHUB_TOKEN } }
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: triage-secrets, key: GITHUB_WEBHOOK_SECRET } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: triage-secrets, key: ANTHROPIC_API_KEY } }
            - name: GITHUB_APP_ID
              valueFrom: { secretKeyRef: { name: triage-secrets, key: GITHUB_APP_ID } }
            - name: TRIAGE_ADMIN_TOKEN    # required header X-Admin-Token for every POST except the webhook
              valueFrom: { secretKeyRef: { name: triage-secrets, key: TRIAGE_ADMIN_TOKEN } }
            - { name: GITHUB_APP_PRIVATE_KEY_PATH, value: "/etc/github-app/private-key.pem" }
            # The eval endpoints write result files; in the container they go to /tmp, not into a docs/ folder.
            # The buildpack sizes the heap from the memory limit and by default leaves 0% headroom for memory outside the
            # heap. The embedding model (ONNX Runtime) allocates outside it, so keep 20% free: heap max ~1.45 GB of 2.5 GB.
            # (Rehearsal, 10 Nov 2026: 631 MB used at peak in a 500-webhook load test, so this is a safety margin.)
            - { name: BPL_JVM_HEAD_ROOM, value: "20" }
            - { name: TRIAGE_EVAL_RESULTS_FILE, value: "/tmp/m3-results.md" }
            - { name: TRIAGE_EVAL_DUPLICATE_CHECK_FILE, value: "/tmp/m4-duplicate-check.md" }
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits: { memory: 2560Mi }   # JVM + the in-process MiniLM model; the buildpack sizes the heap from this
          # Startup loads the embedding model and runs Flyway: ~45 s on a small VM. Allow up to 5 minutes before
          # liveness checks start counting.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          volumeMounts:
            - name: github-app-key
              mountPath: /etc/github-app
              readOnly: true
      volumes:
        - name: github-app-key
          secret:
            secretName: github-app-key
            optional: true   # comment mode needs it; without it the app runs in shadow mode only
---
# HTTP routing with k3s's built-in Traefik: only the paths the public needs. Admin paths (/backfill, /embeddings, /docs,
# /eval) aren't routed at all; reach them with kubectl port-forward (docs/m5-report.md). A Kubernetes Ingress can't restrict
# HTTP methods, so POST /reports/... is routed but refused by the app without the X-Admin-Token header (AdminTokenFilter).
# HTTPS: see docs/m5-report.md (STOP B); replace the host with the VM's DNS name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triage-app
  namespace: triage
spec:
  rules:
    - host: triage.example.com
      http:
        paths:
          - { path: /webhooks/github, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /index.html, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /guide.html, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /theme.css, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /theme.js, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /app.html, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /reports, pathType: Prefix, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /repos, pathType: Prefix, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /settings, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
          - { path: /actuator/health, pathType: Exact, backend: { service: { name: triage-app, port: { number: 80 } } } }
